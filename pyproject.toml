[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-cli"
dynamic = ["version"]
description = "CLI that reads a sales CSV and generates per-product reports (text table or JSON), with flexible date filtering."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Augusto Moreira Magalhães", email = "augustommg@gmail.com" },
]
keywords = ["cli", "csv", "sales", "report"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Source = "https://github.com/AugustoMagalhaes/desafio-relatorio-vendas-avancado"

[project.scripts]
vendas-cli = "sales_cli.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "sales_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sales_cli = ["py.typed"]

[tool.coverage.run]
source = ["sales_cli"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
